name: InternOrbit CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  schedule:
    # Run daily at 06:00 UTC (09:00 AM East Africa Time) to continuously monitor APIs
    - cron: '0 6 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub UI button

jobs:
  validate-and-test:
    name: Validate Workflow & API Health
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run Pipeline Validator & Health Checks
        run: |
          python tests/validate_pipeline.py
